# Render 배포 Blueprint — 백엔드(apps/api)
#
# 사용법: Render 대시보드 → New + → Blueprint → 이 레포 연결
#   (수동 생성 시 New + → Web Service 에 아래 값을 그대로 입력해도 동일)
#
# 개인 레포(Ai-Hwaseong/backend)에서 8/10 에 끝낸 리허설 구성을 팀 레포로 옮긴 것.
# 바뀐 곳 2개:
#   - rootDir: backend → apps/api
#   - PYTHON_VERSION: 3.12.10 → 3.11 (CI 워크플로·로컬 venv 와 통일)
#
# ⚠️ 배포해도 프론트는 아직 붙지 못한다 — CORS 미설정 (#27).
#   프론트가 전부 클라이언트 컴포넌트라 브라우저에서 직접 호출하는데,
#   응답에 Access-Control-Allow-Origin 이 없어 차단된다. #27 이 선행 조건.
#
# ⚠️ 무료 플랜은 유휴 시 인스턴스가 내려간다 — 콜드 스타트 수십 초 (#28).
#   발표 전 워밍업 필요.
#
# 기동 후 확인 — GET /health:
#   {"status":"ok","db":"not_configured","policies":5}
#     - db: not_configured 는 정상 (SUPABASE_URL 미설정 시의 설계된 응답)
#     - policies 가 0 이면 정책 파일을 못 읽은 것 → 아래 POLICIES_DIR 주석을 해제한다
#     - policies 건수는 검수 게이트를 통과한 정책만 센다 (store.py) — data/policies 파일 수와
#       다르면 게이트 탈락분이 있다는 뜻이므로 서버 로그의 "검수 게이트 탈락" 경고를 확인한다
services:
  - type: web
    name: hwaseong-api
    runtime: python
    plan: free
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # store.py 는 정책을 <레포루트>/data/policies 에서 찾는다(app/store.py 기준 상대경로).
      # rootDir 는 빌드·기동의 작업 디렉터리만 바꾸고 체크아웃은 레포 전체라 기본값으로 동작한다.
      # 만약 /health 의 policies 가 0 이면 아래를 주석 해제해 절대경로로 덮어쓴다.
      # - key: POLICIES_DIR
      #   value: /opt/render/project/src/data/policies
