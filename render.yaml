# Render 배포 Blueprint — 백엔드(apps/api)
#
# 사용법: Render 대시보드 → New + → Blueprint → 이 레포 연결
#   (수동 생성 시 New + → Web Service 에 아래 값을 그대로 입력해도 동일)
#
# 개인 레포(Ai-Hwaseong/backend)에서 8/10 에 끝낸 리허설 구성을 팀 레포로 옮긴 것.
# 바뀐 곳 2개:
#   - rootDir: backend → apps/api
#   - PYTHON_VERSION: 3.12.10 → 3.11 (CI 워크플로·로컬 venv 와 통일)
#
# CORS 는 해결됨 (#27) — 프론트가 브라우저에서 직접 호출하므로 CORSMiddleware 가 붙어 있다.
#   *.vercel.app 프리뷰는 코드의 정규식으로 항상 열린다. 커스텀 도메인을 붙이면
#   아래 CORS_ORIGINS 를 주석 해제해 그 주소를 넣는다.
#
# ⚠️ 무료 플랜은 유휴 시 인스턴스가 내려간다 — 콜드 스타트 수십 초 (#28).
#   발표 전 워밍업 필요.
#
# ⛔ 서비스 이름은 onrender.com 전체에서 유일해야 한다.
#   `hwaseong-api` 는 **이미 남이 쓰고 있다** — hwaseong-api.onrender.com 에 접속하면
#   우리와 무관한 앱(/api/notices, /api/teams …)이 응답한다 (2026-08-12 확인).
#   그 주소를 우리 API 로 착각해 C 에게 넘기면 남의 서비스를 호출하게 된다.
#   그래서 이름을 hwaseong-policy-api 로 바꿨다 (같은 날 미사용 확인).
#   ⚠️ 배포 후 Render 가 발급한 실제 URL 을 확인하고, 그 URL 을 팀에 공유한다 —
#      이름이 또 선점돼 있으면 Render 가 임의 접미사를 붙인 다른 URL 을 준다.
#
# 기동 후 확인 — GET /health:
#   {"status":"ok","db":"not_configured","policies":8,"summaries":0}
#     - db: not_configured 는 정상 — 정책은 DB 가 아니라 data/policies 파일 스토어에서 서빙한다.
#       PostgreSQL 전환은 베타 로드맵 항목이라 대회 기간에는 연결하지 않는다
#     - policies 가 0 이면 정책 파일을 못 읽은 것 → 아래 POLICIES_DIR 주석을 해제한다
#     - policies 건수는 검수 게이트를 통과한 정책만 센다 (store.py) — data/policies 파일 수와
#       다르면 게이트 탈락분이 있다는 뜻이므로 서버 로그의 "검수 게이트 탈락" 경고를 확인한다
#     - summaries 는 판정 요약(ai_summary) 건수. 0 이면 ai_summary 가 전부 null 로 나가고
#       C 화면에 "요약 준비 중"만 표시된다 — data/summaries.json 미생성 상태 (#47)
services:
  - type: web
    name: hwaseong-policy-api
    runtime: python
    plan: free
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # store.py 는 정책을 <레포루트>/data/policies 에서 찾는다(app/store.py 기준 상대경로).
      # rootDir 는 빌드·기동의 작업 디렉터리만 바꾸고 체크아웃은 레포 전체라 기본값으로 동작한다.
      # 만약 /health 의 policies 가 0 이면 아래를 주석 해제해 절대경로로 덮어쓴다.
      # - key: POLICIES_DIR
      #   value: /opt/render/project/src/data/policies
      # Vercel 커스텀 도메인을 붙였을 때만 필요 (*.vercel.app 프리뷰는 코드에서 이미 허용).
      # - key: CORS_ORIGINS
      #   value: https://hwaseong-policy.vercel.app
