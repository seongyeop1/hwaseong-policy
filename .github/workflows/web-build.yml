name: 프론트 빌드

# 프론트가 apps/web 으로 옮겨졌는데(#18) 두 워크플로 어디에도 트리거가 없어
# 타입체크·빌드가 자동 검증되지 않았다. next.config 의 typescript.ignoreBuildErrors 가
# 켜져 있어 타입 오류가 빌드를 막지도 않는다 → tsc 를 따로 돌려 실제 타입 상태를 본다.
#
# 타입 검사는 실패해도 워크플로를 막지 않는다(continue-on-error). 지금 코드에 오류가
# 몇 건인지 모르는 상태에서 강제하면 제출 직전에 머지가 잠긴다. 로그로만 남겨
# 사람이 판단하고, 빌드 실패만 확실히 잡는다.

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/web-build.yml"
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # /policies 는 API 를 쓰지 않고 정책 56→48건을 소스에 하드코딩한다.
      # data/policies/*.json 을 고쳐도 따라오지 않아 조용히 어긋난다 — 실제로 두 번 발생했다
      #   #76  HEY 링크에서 menuLevel·menuNo 가 빠져 본문이 안 뜸
      #   #90  구청 경로가 /byeongjeom 등에 머물러 CSS 없는 조각 페이지로 뜸
      # 링크는 화면에 그대로 노출되므로 어긋나면 시민이 잘못된 주소로 간다. 여기서 막는다.
      - name: 정책 링크 동기화 검사 (applyUrl ↔ source_url)
        working-directory: .
        shell: bash
        run: |
          python - <<'PY'
          import re, json, glob, sys
          real = {}
          for p in glob.glob('data/policies/*.json'):
              d = json.load(open(p, encoding='utf-8'))
              real[d['policy_id']] = d['source_url']
          src = open('apps/web/app/policies/page.tsx', encoding='utf-8').read()
          rows = re.findall(r"id: '((?:hs|kr)-[^']+)'[^}]*?applyUrl: '([^']+)'", src, re.S)
          bad = [(pid, u, real.get(pid)) for pid, u in rows if real.get(pid) != u]
          missing = [pid for pid, _ in rows if pid not in real]
          print(f'하드코딩 {len(rows)}건 / 정책 {len(real)}건')
          for pid, got, want in bad:
              print(f'  불일치 {pid}\n    page.tsx : {got}\n    정책 JSON: {want}')
          for pid in missing:
              print(f'  삭제된 정책 참조: {pid}')
          if bad or missing:
              sys.exit('❌ /policies 의 링크가 data/policies 와 어긋납니다 — page.tsx 를 정책 JSON 에 맞추세요')
          print('✅ 링크 동기화 정상')
          PY

      - name: 의존성 설치
        run: npm ci

      - name: 타입 검사 (참고용 — 실패해도 진행)
        continue-on-error: true
        run: npx tsc --noEmit

      - name: 빌드
        run: npm run build
